name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含 LFS 大文件）
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 确保 X5 内核包存在
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/045738_x5.tbs.apk ]; then
            echo "assets 中没有内核包，从上游仓库自动下载"
            curl -L -o /tmp/X5.zip https://github.com/Eanya-Tonic/CCTV_Viewer/raw/master/X5.zip
            unzip -o /tmp/X5.zip -d app/src/main
          fi
          ls -lh app/src/main/assets

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 检查 APK 体积（小于 10MB 说明内核没打进去）
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          SIZE=$(du -m "$APK" | cut -f1)
          echo "产物: $APK  体积: ${SIZE}MB"
          if [ "$SIZE" -lt 10 ]; then
            echo "::warning::APK 只有 ${SIZE}MB，X5 内核可能没打进去，请检查 app/src/main/assets/045738_x5.tbs.apk"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 泰捷电视直播-APK
          path: ./app/build/outputs/apk/debug/*.apk
